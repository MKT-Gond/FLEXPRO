
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>DERMO FLEXPRO PREMIUM - PRETO | Gondopar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      -ms-touch-action: none;
      touch-action: none;
    }

    #KeyShotXR {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>

  <!-- CAMINHO CORRETO DO JAVASCRIPT -->
  <script
    type="text/javascript"
    src="DERMO_FLEXPRO_PREMIUM_PRETO/files/KeyShotXR.js">
  </script>

  <script type="text/javascript">

    // Variável com nome diferente do construtor
    var keyshotViewer;

    function initKeyShotXR() {

      var nameOfDiv = "KeyShotXR";

      // Nome exato da pasta no GitHub
      var folderName =
        "DERMO_FLEXPRO_PREMIUM_PRETO";

      // Resolução original do render
      var viewPortWidth = 1571;
      var viewPortHeight = 823;

      var backgroundColor = "#FFFFFF";

      // Quantidade de imagens
      var uCount = 24;
      var vCount = 5;

      // Configurações de rotação
      var uWrap = true;
      var vWrap = false;

      var uMouseSensitivity = -0.0666667;
      var vMouseSensitivity = 0.03125;

      var uStartIndex = 12;
      var vStartIndex = 3;

      // Zoom
      var minZoom = 1;
      var maxZoom = 1;

      var rotationDamping = 0.96;

      // Ajuste para navegador
      var downScaleToBrowser = true;

      var addDownScaleGUIButton = false;

      var downloadOnInteraction = false;

      // Formato das imagens
      var imageExtension = "jpg";

      // Carregamento
      var showLoading = true;
      var loadingIcon = "ks_logo.png";

      var allowFullscreen = true;

      var uReverse = false;
      var vReverse = false;

      var hotspots = {};

      var isIBooksWidget = false;

      // Inicialização corrigida
      if (typeof window.keyshotXR !== "function") {
        console.error(
          "KeyShotXR.js não carregou corretamente."
        );
        return;
      }

      keyshotViewer = new window.keyshotXR(
        nameOfDiv,
        folderName,
        viewPortWidth,
        viewPortHeight,
        backgroundColor,
        uCount,
        vCount,
        uWrap,
        vWrap,
        uMouseSensitivity,
        vMouseSensitivity,
        uStartIndex,
        vStartIndex,
        minZoom,
        maxZoom,
        rotationDamping,
        downScaleToBrowser,
        addDownScaleGUIButton,
        downloadOnInteraction,
        imageExtension,
        showLoading,
        loadingIcon,
        allowFullscreen,
        uReverse,
        vReverse,
        hotspots,
        isIBooksWidget
      );

    }

    window.addEventListener(
      "load",
      initKeyShotXR
    );

  </script>

</head>

<body oncontextmenu="return false;">

  <div id="KeyShotXR"></div>

</body>

</html>
