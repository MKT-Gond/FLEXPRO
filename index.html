<style>
:root{
  --azul:#092d59;
  --azul-medio:#267fa4;
  --cinza:#67869b;
  --borda:#dcebf1;
  --largura:1300px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--azul);
  background:linear-gradient(
    120deg,
    #f7fcfe,
    #e7f7fb,
    #d9f2f9
  );
}

/* CABEÇALHO */

header{
  background:rgba(255,255,255,.85);
  border-bottom:1px solid var(--borda);
}

.cabecalho{
  width:min(var(--largura),94%);
  margin:auto;
  padding:20px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  display:block;
  width:185px;
  max-height:65px;
  object-fit:contain;
}

.logo-texto{
  display:none;
  color:#d80019;
  font-size:28px;
  font-weight:900;
}

.marca{
  color:var(--cinza);
  font-size:12px;
  text-align:right;
}

/* BANNER */

.banner{
  width:min(var(--largura),94%);
  aspect-ratio:2/1;
  margin:30px auto 0;
  overflow:hidden;
  border-radius:14px;
  background:#e8f5f9;
  box-shadow:0 12px 32px rgba(9,45,89,.09);
}

.banner video,
.banner-imagem{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
}

.banner video{
  display:block;
}

.banner-imagem{
  display:none;
}

/* CONTEÚDO */

main{
  width:min(var(--largura),94%);
  margin:0 auto;
  padding:30px 0 75px;
  flex:1;
}

.referencia{
  color:var(--azul-medio);
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}

h1{
  margin:12px 0;
  font-size:clamp(30px,4vw,46px);
}

.descricao{
  margin:0;
  color:var(--cinza);
  font-size:14px;
  line-height:1.7;
}

/* FILTROS */

.barra-filtros{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin:35px 0 23px;
}

.filtros-esquerda{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.botao-filtro{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border:1px solid var(--azul);
  border-radius:9px;
  background:var(--azul);
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.botao-filtro:hover,
.botao-filtro.ativo{
  background:var(--azul-medio);
}

.filtro-atual{
  padding:11px 14px;
  border:1px solid #d4e7ee;
  border-radius:8px;
  background:white;
  font-size:11px;
  font-weight:bold;
}

.contador{
  color:var(--cinza);
  font-size:11px;
  font-weight:bold;
}

.painel-filtros{
  display:none;
  margin-bottom:28px;
  padding:20px;
  border:1px solid var(--borda);
  border-radius:12px;
  background:white;
}

.painel-filtros.aberto{
  display:block;
}

.painel-filtros h2{
  font-size:12px;
  margin:0 0 15px;
}

.opcoes-categoria{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.opcao-categoria{
  padding:12px 15px;
  border:1px solid #d7e7ee;
  border-radius:8px;
  background:#f8fcfd;
  color:var(--azul);
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.opcao-categoria:hover{
  border-color:var(--azul-medio);
}

.opcao-categoria.selecionada{
  background:var(--azul);
  color:white;
}

/* GRADE DE PRODUTOS */

.grade{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
}

.card{
  display:flex;
  flex-direction:column;
  min-width:0;
  overflow:hidden;
  border:1px solid var(--borda);
  border-radius:15px;
  background:white;
  color:inherit;
  text-decoration:none;
  box-shadow:0 10px 28px rgba(9,45,89,.07);
  transition:transform .2s,box-shadow .2s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 17px 35px rgba(9,45,89,.13);
}

/* IMAGENS QUADRADAS */

.card-imagem{
  width:100%;
  aspect-ratio:1/1;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f7fbfd;
  overflow:hidden;
}

.card-imagem img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

/* IMAGEM EM PREPARAÇÃO */

.sem-imagem{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  height:100%;
  border:1px dashed #c5dce7;
  border-radius:10px;
  background:#f1f9fc;
  color:#91adba;
  text-align:center;
  font-size:11px;
  font-weight:bold;
}

.sem-imagem svg{
  width:43px;
  height:43px;
  stroke:#9ab5c3;
}

/* INFORMAÇÕES DOS CARDS */

.card-conteudo{
  padding:18px 20px 21px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.card-categoria{
  margin-bottom:9px;
  color:var(--azul-medio);
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.card h3{
  margin:0 0 10px;
  font-size:17px;
  line-height:1.4;
}

.card p{
  margin:0 0 19px;
  color:var(--cinza);
  font-size:12px;
  line-height:1.6;
}

.abrir{
  align-self:flex-start;
  margin-top:auto;
  padding:12px 16px;
  border-radius:8px;
  background:var(--azul);
  color:white;
  font-size:10px;
  font-weight:bold;
}

.card:hover .abrir{
  background:var(--azul-medio);
}

/* RODAPÉ */

footer{
  padding:26px 5%;
  text-align:center;
  border-top:1px solid var(--borda);
  color:var(--cinza);
  font-size:11px;
}

/* RESPONSIVIDADE */

@media(max-width:1000px){

  .grade{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

@media(max-width:650px){

  .cabecalho{

    padding:16px 0;
  }

  .logo{

  }

  .marca{
    font-size:10px;
  }

  .banner{

    margin-top:18px;
  }

  main{

    padding:25px 0 50px;
  }

  h1{

  }

  .descricao{

  }

  .grade{
    grid-template-columns:1fr;
    gap:20px;
  }

  .card{
    width:100%;
    max-width:420px;
    margin:auto;
  }

  .card-conteudo{
    padding:17px;
  }

}

</style>

function criarPlaceholder(){

  const placeholder =
    document.createElement("div");

  placeholder.className = "sem-imagem";

  placeholder.innerHTML = `

    <svg
      viewBox="0 0 48 48"
      fill="none"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true">

      <rect
        x="5"

        width="38"
        height="34"
        rx="4"/>

        r="3"/>

    </svg>

    <span>IMAGEM EM PREPARAÇÃO</span>

  `;

  return placeholder;

}

/* CARREGAMENTO DAS IMAGENS */

function criarImagem(nomeImagem){

  const container =
    document.createElement("div");

  container.className = "card-imagem";

  if(!nomeImagem){

    container.appendChild(
      criarPlaceholder()
    );

    return container;

  }

  const img =
    document.createElement("img");

  img.alt = nomeImagem;
  img.loading = "lazy";

  const extensoes = [
    ".png",
    ".jpg",
    ".jpeg",
    ".webp"
  ];

  let tentativa = 0;

  function carregarImagem(){

    img.src = encodeURI(
      "imagens/" +
      nomeImagem +
      extensoes[tentativa]
    );

  }

  img.onerror = function(){

    tentativa++;

    if(tentativa < extensoes.length){

      carregarImagem();

    }else{

      img.remove();

      container.appendChild(
        criarPlaceholder()
      );

    }

  };

  container.appendChild(img);

  carregarImagem();

  return container;

}

/* CRIAÇÃO DOS CARDS */

function criarCard(produto){

  const card =
    document.createElement("a");

  card.className = "card";

  card.href = produto.pagina ||
    "produtos/em-preparacao.html";

  card.appendChild(
    criarImagem(produto.imagem)
  );

  const conteudo =
    document.createElement("div");

  conteudo.className = "card-conteudo";

  const categoria =
    document.createElement("div");

  categoria.className = "card-categoria";

  categoria.textContent =
    nomesCategorias[
      produto.categoria
    ].toUpperCase();

  const titulo =
    document.createElement("h3");

  titulo.textContent =
    produto.nome.toUpperCase();

  const descricao =
    document.createElement("p");

  descricao.textContent = produto.pagina
    ? "Visualização interativa do produto."
    : "Página do produto em preparação.";

  const abrir =
    document.createElement("span");

  abrir.className = "abrir";

  abrir.textContent = produto.pagina
    ? "EXPLORAR EM 360° →"
    : "EM PREPARAÇÃO →";

  conteudo.appendChild(categoria);
  conteudo.appendChild(titulo);
  conteudo.appendChild(descricao);
  conteudo.appendChild(abrir);

  card.appendChild(conteudo);

  return card;

}

/* RENDERIZAÇÃO DO CATÁLOGO */

function renderizarProdutos(){

  gradeProdutos.innerHTML = "";

  const produtosFiltrados =
    categoriaSelecionada === "todos"

    ? produtos

    : produtos.filter(produto =>
        produto.categoria === categoriaSelecionada
      );

  produtosFiltrados.forEach(produto => {

    gradeProdutos.appendChild(
      criarCard(produto)
    );

  });

  contador.textContent =
    produtosFiltrados.length +
    (
      produtosFiltrados.length === 1
      ? " PRODUTO"
      : " PRODUTOS"
    );

  filtroAtual.textContent =
    categoriaSelecionada === "todos"

    ? "TODOS OS PRODUTOS"

    : nomesCategorias[
        categoriaSelecionada
      ].toUpperCase();

}

/* CRIAÇÃO DOS FILTROS */

function criarFiltros(){

  opcoesCategoria.innerHTML = "";

  const todasCategorias = [

    ["todos","Todos os produtos"],

    ...categorias

  ];

  todasCategorias.forEach(([id,nome]) => {

    const botao =
      document.createElement("button");

    botao.type = "button";

    botao.className =
      "opcao-categoria";

    botao.textContent =
      nome.toUpperCase();

    botao.setAttribute(
      "aria-pressed",
      String(id === categoriaSelecionada)
    );

    if(id === categoriaSelecionada){

      botao.classList.add(
        "selecionada"
      );

    }

    botao.addEventListener("click",()=>{

      categoriaSelecionada = id;

      criarFiltros();

      renderizarProdutos();

      painelFiltros.classList.remove(
        "aberto"
      );

      botaoFiltro.classList.remove(
        "ativo"
      );

      botaoFiltro.setAttribute(
        "aria-expanded",
        "false"
      );

    });

    opcoesCategoria.appendChild(botao);

  });

}

/* ABRIR E FECHAR FILTROS */

botaoFiltro.addEventListener("click",()=>{

  const aberto =
    painelFiltros.classList.toggle(
      "aberto"
    );

  botaoFiltro.classList.toggle(
    "ativo",
    aberto
  );

  botaoFiltro.setAttribute(
    "aria-expanded",
    String(aberto)
  );

});

/* INICIALIZAÇÃO */

criarFiltros();

renderizarProdutos();

</script>
