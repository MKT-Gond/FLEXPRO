<style>
:root {
  --azul: #092d59;
  --azul-medio: #267fa4;
  --cinza: #67869b;
  --borda: #dcebf1;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--azul);
  background: linear-gradient(
    120deg,
    #f7fcfe 0%,
    #e7f7fb 55%,
    #d9f2f9 100%
  );
}

/* CABEÇALHO */

header {
  background: rgba(255,255,255,.85);
  border-bottom: 1px solid var(--borda);
}

.cabecalho {
  width: min(1300px,94%);
  margin: auto;
  padding: 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  display: block;
  width: 185px;
  max-height: 65px;
  object-fit: contain;
}

.logo-texto {
  display: none;
  color: #d80019;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 1px;
}

.marca {
  color: var(--cinza);
  font-size: 12px;
  text-align: right;
}

/* BANNER EM VÍDEO */

.banner {
  width: 100%;
  overflow: hidden;
  background: #e8f5f9;
}

.banner video {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.banner-imagem {
  display: none;
  width: 100%;
  height: auto;
  object-fit: contain;
}

/* CONTEÚDO */

main {
  width: min(1300px,94%);
  margin: 0 auto;
  padding: 43px 0 75px;
  flex: 1;
}

.referencia {
  display: block;
  color: var(--azul-medio);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

h1 {
  margin: 12px 0;
  font-size: clamp(30px,4vw,46px);
  line-height: 1.2;
}

.descricao {
  margin: 0;
  color: var(--cinza);
  font-size: 14px;
  line-height: 1.7;
}

/* FILTROS */

.barra-filtros {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
  margin: 35px 0 23px;
}

.filtros-esquerda {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.botao-filtro {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border: 1px solid var(--azul);
  border-radius: 9px;
  background: var(--azul);
  color: white;
  font: 700 12px Arial, sans-serif;
  cursor: pointer;
  transition: background .2s, border-color .2s;
}

.botao-filtro:hover,
.botao-filtro.ativo {
  background: var(--azul-medio);
  border-color: var(--azul-medio);
}

.seta {
  transition: transform .2s;
}

.botao-filtro.ativo .seta {
  transform: rotate(180deg);
}

.filtro-atual {
  padding: 11px 14px;
  border: 1px solid #d4e7ee;
  border-radius: 8px;
  background: rgba(255,255,255,.75);
  font-size: 11px;
  font-weight: bold;
}

.contador {
  color: var(--cinza);
  font-size: 11px;
  font-weight: bold;
}

/* PAINEL DE CATEGORIAS */

.painel-filtros {
  display: none;
  margin-bottom: 28px;
  padding: 20px;
  border: 1px solid var(--borda);
  border-radius: 12px;
  background: rgba(255,255,255,.92);
}

.painel-filtros.aberto {
  display: block;
}

.painel-filtros h2 {
  margin: 0 0 15px;
  font-size: 12px;
  letter-spacing: 1px;
}

.opcoes-categoria {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.opcao-categoria {
  padding: 12px 15px;
  border: 1px solid #d7e7ee;
  border-radius: 8px;
  background: #f8fcfd;
  color: var(--azul);
  font: 700 11px Arial, sans-serif;
  cursor: pointer;
}

.opcao-categoria:hover {
  border-color: var(--azul-medio);
}

.opcao-categoria.selecionada {
  background: var(--azul);
  border-color: var(--azul);
  color: white;
}

/* GRADE DE PRODUTOS */

.grade {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 24px;
  align-items: stretch;
}

/* CARDS */

.card {
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--borda);
  border-radius: 15px;
  background: white;
  color: inherit;
  text-decoration: none;
  box-shadow: 0 10px 28px rgba(9,45,89,.07);
  transition: transform .2s, box-shadow .2s;
}

a.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 17px 35px rgba(9,45,89,.13);
}

/* IMAGENS DOS PRODUTOS - 1050 x 900 */

.card-imagem {
  width: 100%;
  aspect-ratio: 7 / 6;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #f7fbfd;
}

.card-imagem img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}

/* PRODUTOS SEM IMAGEM */

.sem-imagem {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  width: 100%;
  height: 100%;
  border: 1px dashed #c5dce7;
  border-radius: 10px;
  background: linear-gradient(135deg,#f7fcfe,#edf7fa);
  color: #91adba;
  text-align: center;
}

.sem-imagem svg {
  width: 43px;
  height: 43px;
  stroke: #9ab5c3;
}

.sem-imagem span {
  font-size: 11px;
  font-weight: bold;
  letter-spacing: .5px;
}

/* CONTEÚDO DOS CARDS */

.card-conteudo {
  padding: 18px 20px 21px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.card-categoria {
  display: block;
  margin-bottom: 9px;
  color: var(--azul-medio);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
}

.card h3 {
  margin: 0 0 10px;
  font-size: 17px;
  line-height: 1.4;
}

.card p {
  margin: 0 0 19px;
  color: var(--cinza);
  font-size: 12px;
  line-height: 1.6;
}

.abrir {
  display: inline-block;
  align-self: flex-start;
  margin-top: auto;
  padding: 12px 16px;
  border-radius: 8px;
  background: var(--azul);
  color: white;
  font-size: 10px;
  font-weight: bold;
}

a.card:hover .abrir {
  background: var(--azul-medio);
}

.card.pendente .abrir {
  background: #eaf2f6;
  color: #7892a2;
}

/* RODAPÉ */

footer {
  padding: 26px 5%;
  text-align: center;
  background: rgba(255,255,255,.4);
  border-top: 1px solid var(--borda);
  color: var(--cinza);
  font-size: 11px;
}

/* TABLET */

@media(max-width:1000px) {
  .grade {
    grid-template-columns: repeat(2,minmax(0,1fr));

/* CELULAR */

    font-size: 10px;
  }

    grid-template-columns: 1fr;
    gap: 20px;
  }

    width: 100%;
    max-width: 420px;
    margin: 0 auto;
  }

  .card h3 {
    font-size: 16px;
  }

  .card-conteudo {
    padding: 17px;

const grade = document.getElementById("gradeProdutos");
const contador = document.getElementById("contador");
const filtroAtual = document.getElementById("filtroAtual");
const botaoFiltro = document.getElementById("botaoFiltro");
const painelFiltros = document.getElementById("painelFiltros");
const opcoesCategoria = document.getElementById("opcoesCategoria");

let categoriaSelecionada = "todos";

/* FUNÇÕES AUXILIARES */

function elemento(tag,classe,texto) {
  const el = document.createElement(tag);

  if (classe) {
    el.className = classe;
  }

  if (texto !== undefined) {
    el.textContent = texto;
  }

  return el;
}

function nomeCategoria(id) {
  const categoria = categorias.find(function(item) {
    return item.id === id;
  });

  return categoria ? categoria.nome : "";
}

/* PLACEHOLDER SEM IMAGEM */

function criarPlaceholder() {
  const caixa = elemento("div","sem-imagem");

  const icone = document.createElementNS(
    "http://www.w3.org/2000/svg","svg"
  );

  icone.setAttribute("viewBox","0 0 24 24");
  icone.setAttribute("fill","none");
  icone.setAttribute("stroke-width","1.5");
  icone.setAttribute("stroke-linecap","round");
  icone.setAttribute("stroke-linejoin","round");
  icone.setAttribute("aria-hidden","true");

  const caminho = document.createElementNS(
    "http://www.w3.org/2000/svg","path"
  );

  caminho.setAttribute(
    "d",
    "M3 3h18v18H3z M8 8h.01 M3 17l5-5 4 4 3-3 6 6"
  );

  icone.appendChild(caminho);
  caixa.appendChild(icone);

  caixa.appendChild(
    elemento("span","","IMAGEM EM PREPARAÇÃO")
  );

  return caixa;
}

/* CRIA OS CARDS */

function criarCard(produto) {
  const temPagina = Boolean(produto.pagina);

  const card = document.createElement(
    temPagina ? "a" : "article"
  );

  card.className = temPagina ? "card" : "card pendente";

  if (temPagina) {
    card.href = produto.pagina;
    card.setAttribute(
      "aria-label",
      "Explorar " + produto.nome + " em 360 graus"
    );
  }

  const imagemContainer = elemento("div","card-imagem");

  if (produto.imagem) {
    const imagem = document.createElement("img");

    imagem.src = "imagens/" + produto.imagem + ".png";
    imagem.alt = produto.nome;
    imagem.loading = "lazy";

    imagem.onerror = function() {
      imagemContainer.replaceChildren(criarPlaceholder());
    };

    imagemContainer.appendChild(imagem);
  } else {
    imagemContainer.appendChild(criarPlaceholder());
  }

  const conteudo = elemento("div","card-conteudo");

  const categoria = elemento(
    "span",
    "card-categoria",
    nomeCategoria(produto.categoria).toUpperCase()
  );

  const titulo = elemento(
    "h3",
    "",
    produto.nome.toUpperCase()
  );

  const descricao = elemento(
    "p",
    "",
    temPagina
      ? "Visualização interativa do produto."
      : produto.imagem
        ? "Conheça este modelo da linha FLEXPRO."
        : "Produto em preparação para o catálogo."
  );

  const abrir = elemento(
    "span",
    "abrir",
    temPagina
      ? "EXPLORAR EM 360° →"
      : produto.imagem
        ? "360° EM PREPARAÇÃO"
        : "EM PREPARAÇÃO"
  );

  conteudo.appendChild(categoria);
  conteudo.appendChild(titulo);
  conteudo.appendChild(descricao);
  conteudo.appendChild(abrir);

  card.appendChild(imagemContainer);
  card.appendChild(conteudo);

  return card;
}

/* RENDERIZAÇÃO */

function renderizarProdutos() {
  grade.replaceChildren();

  const visiveis = produtos.filter(function(produto) {
    return categoriaSelecionada === "todos" ||
           produto.categoria === categoriaSelecionada;
  });

  visiveis.forEach(function(produto) {
    grade.appendChild(criarCard(produto));
  });

  contador.textContent =
    visiveis.length +
    (visiveis.length === 1 ? " PRODUTO" : " PRODUTOS");

  filtroAtual.textContent =
    categoriaSelecionada === "todos"
      ? "TODOS OS PRODUTOS"
      : nomeCategoria(categoriaSelecionada).toUpperCase();
}

/* OPÇÕES DO FILTRO */

function criarOpcao(id,nome) {
  const botao = elemento(
    "button",
    "opcao-categoria",
    nome.toUpperCase()
  );

  botao.type = "button";
  botao.dataset.categoria = id;

  botao.addEventListener("click",function() {
    categoriaSelecionada = id;

    atualizarBotoes();
    renderizarProdutos();

    painelFiltros.classList.remove("aberto");
    botaoFiltro.classList.remove("ativo");
    botaoFiltro.setAttribute("aria-expanded","false");
  });

  opcoesCategoria.appendChild(botao);
}

criarOpcao("todos","Todos os produtos");

categorias.forEach(function(categoria) {
  criarOpcao(categoria.id,categoria.nome);
});

/* BOTÃO SELECIONADO */

function atualizarBotoes() {
  const botoes = opcoesCategoria.querySelectorAll(
    ".opcao-categoria"
  );

  botoes.forEach(function(botao) {
    const selecionado =
      botao.dataset.categoria === categoriaSelecionada;

    botao.classList.toggle("selecionada",selecionado);
    botao.setAttribute("aria-pressed",String(selecionado));
  });
}

/* ABRIR / FECHAR FILTRO */

botaoFiltro.addEventListener("click",function() {
  const aberto = painelFiltros.classList.toggle("aberto");

  botaoFiltro.classList.toggle("ativo",aberto);
  botaoFiltro.setAttribute("aria-expanded",String(aberto));
});

/* INICIALIZAÇÃO */

atualizarBotoes();
renderizarProdutos();

</script>

</body>
</html>
