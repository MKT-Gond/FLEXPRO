
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Catálogo FLEXPRO | Gondopar</title>

<style>
:root {
  --azul:#092d59;
  --azul-medio:#267fa4;
  --cinza:#67869b;
  --borda:#dcebf1;
}

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--azul);
  background:linear-gradient(
    120deg,
    #f7fcfe 0%,
    #e7f7fb 55%,
    #d9f2f9 100%
  );
}

/* CABEÇALHO */

header {
  background:rgba(255,255,255,.75);
  border-bottom:1px solid var(--borda);
}

.cabecalho {
  width:min(1300px,94%);
  margin:auto;
  padding:22px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo {
  display:block;
  width:185px;
  max-height:65px;
  object-fit:contain;
}

.marca {
  color:var(--cinza);
  font-size:12px;
  text-align:right;
}

/* CONTEÚDO */

main {
  width:min(1300px,94%);
  margin:0 auto;
  padding:45px 0 75px;
  flex:1;
}

.referencia {
  display:block;
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  color:var(--azul-medio);
}

h1 {
  margin:12px 0;
  font-size:clamp(30px,4vw,46px);
  line-height:1.2;
}

.descricao {
  margin:0;
  color:var(--cinza);
  font-size:14px;
  line-height:1.7;
}

/* FILTROS */

.barra-filtros {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:15px;
  margin:35px 0 23px;
}

.filtros-esquerda {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.botao-filtro {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border:1px solid var(--azul);
  border-radius:9px;
  background:var(--azul);
  color:white;
  font-family:inherit;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.botao-filtro:hover,
.botao-filtro.ativo {
  background:var(--azul-medio);
  border-color:var(--azul-medio);
}

.seta {
  font-size:12px;
  transition:transform .2s;
}

.botao-filtro.ativo .seta {
  transform:rotate(180deg);
}

.filtro-atual {
  padding:11px 14px;
  border:1px solid #d4e7ee;
  border-radius:8px;
  background:rgba(255,255,255,.75);
  color:var(--azul);
  font-size:11px;
  font-weight:bold;
}

.contador {
  color:var(--cinza);
  font-size:11px;
  font-weight:bold;
  letter-spacing:.5px;
}

/* PAINEL DE CATEGORIAS */

.painel-filtros {
  display:none;
  margin-bottom:28px;
  padding:20px;
  border:1px solid var(--borda);
  border-radius:12px;
  background:rgba(255,255,255,.9);
  box-shadow:0 8px 25px rgba(9,45,89,.04);
}

.painel-filtros.aberto {
  display:block;
}

.painel-filtros h2 {
  margin:0 0 15px;
  font-size:12px;
  letter-spacing:1px;
}

.opcoes-categoria {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.opcao-categoria {
  padding:12px 15px;
  border:1px solid #d7e7ee;
  border-radius:8px;
  background:#f8fcfd;
  color:var(--azul);
  font-family:inherit;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.opcao-categoria:hover {
  border-color:var(--azul-medio);
}

.opcao-categoria.selecionada {
  background:var(--azul);
  border-color:var(--azul);
  color:white;
}

/* GRADE */

.grade {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  align-items:stretch;
}

/* CARDS */

.card {
  display:flex;
  flex-direction:column;
  min-width:0;
  overflow:hidden;
  border:1px solid var(--borda);
  border-radius:15px;
  background:white;
  color:inherit;
  text-decoration:none;
  box-shadow:0 10px 28px rgba(9,45,89,.07);
  transition:transform .2s,box-shadow .2s;
}

a.card:hover {
  transform:translateY(-4px);
  box-shadow:0 17px 35px rgba(9,45,89,.13);
}

/* IMAGENS 1050 x 900 */

.card-imagem {
  width:100%;
  aspect-ratio:7 / 6;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#f7fbfd;
}

.card-imagem img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
}

/* CONTEÚDO DOS CARDS */

.card-conteudo {
  padding:18px 20px 21px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.card-categoria {
  display:block;
  margin-bottom:9px;
  color:var(--azul-medio);
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.card h3 {
  margin:0 0 10px;
  font-size:17px;
  line-height:1.4;
}

.card p {
  margin:0 0 19px;
  color:var(--cinza);
  font-size:12px;
  line-height:1.6;
}

.abrir {
  display:inline-block;
  align-self:flex-start;
  margin-top:auto;
  padding:12px 16px;
  border-radius:8px;
  background:var(--azul);
  color:white;
  font-size:10px;
  font-weight:bold;
  letter-spacing:.3px;
}

a.card:hover .abrir {
  background:var(--azul-medio);
}

.card.pendente .abrir {
  background:#eaf2f6;
  color:#7892a2;
}

/* RODAPÉ */

footer {
  padding:26px 5%;
  text-align:center;
  background:rgba(255,255,255,.4);
  border-top:1px solid var(--borda);
  color:var(--cinza);
  font-size:11px;
}

/* TABLET */

@media(max-width:1000px) {
  .grade {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* CELULAR */

@media(max-width:650px) {
  .cabecalho {
    width:92%;
    padding:17px 0;
  }

  .logo {
    width:135px;
  }

  .marca {
    font-size:10px;
  }

  main {
    width:92%;
    padding:30px 0 50px;
  }

  h1 {
    font-size:31px;
  }

  .descricao {
    font-size:12px;
  }

  .barra-filtros {
    margin:27px 0 20px;
    align-items:flex-start;
  }

  .filtros-esquerda {
    width:100%;
  }

  .botao-filtro {
    padding:12px 14px;
    font-size:11px;
  }

  .filtro-atual {
    font-size:10px;
  }

  .painel-filtros {
    padding:15px;
  }

  .opcao-categoria {
    padding:10px 12px;
    font-size:10px;
  }

  .grade {
    grid-template-columns:1fr;
    gap:20px;
  }

  .card {
    width:100%;
    max-width:420px;
    margin:0 auto;
  }

  .card h3 {
    font-size:16px;
  }

  .card-conteudo {
    padding:17px;
  }
}
</style>
</head>

<body>

<header>
  <div class="cabecalho">
    <img
      id="logo"
      class="logo"
      src="imagens/logo-gondopar.png.png"
      alt="Gondopar">

    <div class="marca">
      Gôndolas e mobílias especiais
    </div>
  </div>
</header>

<main>

  <section class="apresentacao">
    <span class="referencia">CATÁLOGO INTERATIVO</span>

    <h1>LINHA FLEXPRO</h1>

    <p class="descricao">
      Conheça nossas soluções em mobiliário para farmácias.
      Explore os modelos e visualize os produtos disponíveis em 360°.
    </p>
  </section>

  <div class="barra-filtros">

    <div class="filtros-esquerda">

      <button
        id="botaoFiltro"
        class="botao-filtro"
        type="button"
        aria-expanded="false"
        aria-controls="painelFiltros">

        <span>☷</span>
        FILTRAR POR CATEGORIA
        <span class="seta">▼</span>

      </button>

      <span id="filtroAtual" class="filtro-atual">
        TODOS OS PRODUTOS
      </span>

    <span id="contador" class="contador">
      29 PRODUTOS
    </span>

  </div>

  <div id="painelFiltros" class="painel-filtros">
    <h2>SELECIONE UMA CATEGORIA</h2>
    <div id="opcoesCategoria" class="opcoes-categoria"></div>
  </div>

  <section
    id="gradeProdutos"
    class="grade"
    aria-label="Produtos FLEXPRO">
  </section>

</main>

<footer>
  GONDOPAR | Gôndolas e mobílias especiais
</footer>

<script>

/* LOGO */

const logo=document.getElementById("logo");

logo.onerror=function(){
  if(!this.dataset.alternativa){
    this.dataset.alternativa="sim";
    this.src="imagens/logo-gondopar.png";

/* CATEGORIAS */

/*

*/

  {

    pagina:null
  }

];

/* ELEMENTOS */

const grade=document.getElementById("gradeProdutos");
const contador=document.getElementById("contador");
const filtroAtual=document.getElementById("filtroAtual");
const botaoFiltro=document.getElementById("botaoFiltro");
const painelFiltros=document.getElementById("painelFiltros");
const opcoesCategoria=document.getElementById("opcoesCategoria");

let categoriaSelecionada="todos";

/* FUNÇÕES */

function elemento(tag,classe,texto){
  const el=document.createElement(tag);

  if(classe){
    el.className=classe;
  }

  if(texto!==undefined){
    el.textContent=texto;
  }

  return el;
}

function nomeCategoria(id){
  const categoria=categorias.find(function(item){
    return item.id===id;
  });

  return categoria?categoria.nome:"";
}

function criarCard(produto){

  const temPagina=Boolean(produto.pagina);

  const card=document.createElement(
    temPagina?"a":"article"
  );

  card.className=temPagina?"card":"card pendente";

  if(temPagina){
    card.href=produto.pagina;
    card.setAttribute(
      "aria-label",
      "Explorar "+produto.nome+" em 360 graus"
    );
  }

  const imagemContainer=elemento("div","card-imagem");

  const imagem=document.createElement("img");

  imagem.src="imagens/"+produto.imagem+".png";
  imagem.alt=produto.nome;
  imagem.loading="lazy";

  imagemContainer.appendChild(imagem);

  const conteudo=elemento("div","card-conteudo");

  const categoria=elemento(
    "span",
    "card-categoria",
    nomeCategoria(produto.categoria).toUpperCase()
  );

  const titulo=elemento(
    "h3",
    "",
    produto.nome.toUpperCase()
  );

  const descricao=elemento(
    "p",
    "",
    temPagina
      ?"Visualização interativa do produto."
      :"Conheça este modelo da linha FLEXPRO."
  );

  const abrir=elemento(
    "span",
    "abrir",
    temPagina
      ?"EXPLORAR EM 360° →"
      :"360° EM PREPARAÇÃO"
  );

  conteudo.appendChild(categoria);
  conteudo.appendChild(titulo);
  conteudo.appendChild(descricao);
  conteudo.appendChild(abrir);

  card.appendChild(imagemContainer);
  card.appendChild(conteudo);

  return card;
}

/* RENDERIZAÇÃO */

function renderizarProdutos(){

  grade.replaceChildren();

  const visiveis=produtos.filter(function(produto){
    return categoriaSelecionada==="todos" ||
           produto.categoria===categoriaSelecionada;
  });

  visiveis.forEach(function(produto){
    grade.appendChild(criarCard(produto));
  });

  contador.textContent=
    visiveis.length+
    (visiveis.length===1?" PRODUTO":" PRODUTOS");

  filtroAtual.textContent=
    categoriaSelecionada==="todos"
      ?"TODOS OS PRODUTOS"
      :nomeCategoria(categoriaSelecionada).toUpperCase();

}

/* OPÇÕES DE CATEGORIA */

function criarOpcao(id,nome){

  const botao=elemento(
    "button",
    "opcao-categoria",
    nome.toUpperCase()
  );

  botao.type="button";
  botao.dataset.categoria=id;

  botao.addEventListener("click",function(){

    categoriaSelecionada=id;

    atualizarBotoes();
    renderizarProdutos();

    painelFiltros.classList.remove("aberto");
    botaoFiltro.classList.remove("ativo");
    botaoFiltro.setAttribute("aria-expanded","false");

  });

  opcoesCategoria.appendChild(botao);
}

criarOpcao("todos","Todos os produtos");

categorias.forEach(function(categoria){
  criarOpcao(categoria.id,categoria.nome);
});

/* BOTÃO SELECIONADO */

function atualizarBotoes(){

  const botoes=opcoesCategoria.querySelectorAll(
    ".opcao-categoria"
  );

  botoes.forEach(function(botao){

    const selecionado=
      botao.dataset.categoria===categoriaSelecionada;

    botao.classList.toggle("selecionada",selecionado);
    botao.setAttribute("aria-pressed",String(selecionado));

  });

}

/* ABRIR / FECHAR FILTRO */

botaoFiltro.addEventListener("click",function(){

  const aberto=painelFiltros.classList.toggle("aberto");

  botaoFiltro.classList.toggle("ativo",aberto);
  botaoFiltro.setAttribute("aria-expanded",String(aberto));

});

/* INICIALIZAÇÃO */

atualizarBotoes();
renderizarProdutos();

</script>
