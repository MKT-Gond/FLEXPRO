
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlexPro | Catálogo Virtual 3D Gondopar</title>

<style>
:root {
  --azul: #052b5b;
  --azul-claro: #b8eff9;
  --ciano: #42c9e8;
  --vermelho: #d80019;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--azul);
  background: #e8f9fc;
}

/* FUNDO FLEXPRO */

.fundo {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;

  background:
    radial-gradient(
      ellipse at 20% 25%,
      rgba(255,255,255,.96),
      transparent 48%
    ),
    radial-gradient(
      ellipse at 85% 20%,
      rgba(68,213,241,.45),
      transparent 55%
    ),
    linear-gradient(
      135deg,
      #f9fdff 0%,
      #d7f5fb 48%,
      #9ee7f3 100%
    );
}

.fundo::before {
  content: "";
  position: absolute;
  width: 80vw;
  height: 80vw;
  right: -25vw;
  top: -25vw;
  border: 3px solid rgba(0,128,186,.22);
  border-radius: 18%;
  transform: rotate(45deg);

  box-shadow:
    0 0 0 55px rgba(255,255,255,.15),
    0 0 0 115px rgba(0,170,220,.07),
    0 0 0 180px rgba(255,255,255,.18);
}

.fundo::after {
  content: "";
  position: absolute;
  width: 85vw;
  height: 85vw;
  left: -55vw;
  bottom: -60vw;
  border: 2px solid rgba(0,130,190,.2);
  transform: rotate(45deg);
  border-radius: 15%;
}

/* CABEÇALHO */

header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
  padding: 15px 6%;
  min-height: 110px;

  background: rgba(255,255,255,.72);
  border-bottom: 1px solid rgba(255,255,255,.9);
  backdrop-filter: blur(12px);
}

/* LOGO ORIGINAL GONDOPAR */

.logo-link {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-shrink: 0;
  text-decoration: none;
}

.logo {
  display: block;
  width: 230px;
  max-width: 100%;
  max-height: 90px;
  height: auto;
  object-fit: contain;
  object-position: left center;
}

.logo-fallback {
  display: none;
  color: var(--azul);
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 3px;
}

.header-direita {
  color: var(--azul);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-align: right;
}

/* APRESENTAÇÃO */

.hero {
  max-width: 1250px;
  margin: auto;
  padding: 75px 25px 65px;
}

.hero-conteudo {
  border-left: 4px solid var(--ciano);
  padding-left: 28px;
}

.categoria {
  color: var(--azul);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 4px;
  text-transform: uppercase;
}

.hero h1 {
  margin: 12px 0;
  font-size: clamp(55px, 9vw, 105px);
  line-height: 1.05;
  letter-spacing: -4px;
  font-weight: 900;
  color: var(--azul);
}

.hero h1 span {
  color: #32bfe5;
}

.hero p {
  max-width: 570px;
  margin: 18px 0 0;
  color: #486b8a;
  font-size: 15px;
  line-height: 1.8;
}

/* CATÁLOGO */

main {
  max-width: 1250px;
  margin: auto;
  padding: 20px 25px 85px;
}

.titulo-secao {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 28px;
  padding-left: 15px;
  border-left: 3px solid var(--ciano);
}

.titulo-secao h2 {
  margin: 0;
  font-size: 25px;
  color: var(--azul);
}

.titulo-secao span {
  color: #537b98;
  font-size: 12px;
  letter-spacing: 1px;
}

.grade {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 24px;
}

/* CARDS */

.produto {
  overflow: hidden;
  border-radius: 15px;
  background: rgba(255,255,255,.88);
  border: 1px solid rgba(255,255,255,.95);
  box-shadow: 0 10px 30px rgba(5,43,91,.07);
  transition: transform .25s, box-shadow .25s;
}

.produto:hover {
  transform: translateY(-5px);
  box-shadow: 0 20px 40px rgba(5,43,91,.13);
}

.imagem {
  height: 270px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.85),
    rgba(210,239,247,.65)
  );
}

.imagem img {
  width: 90%;
  height: 90%;
  object-fit: contain;
}

.placeholder {
  text-align: center;
  font-size: 13px;
  color: #7893a8;
  padding: 25px;
}

.selo {
  position: absolute;
  z-index: 1;
  top: 15px;
  left: 15px;
  padding: 7px 12px;
  border-radius: 20px;
  background: white;
  color: var(--azul);
  font-size: 10px;
  font-weight: bold;
  letter-spacing: 1px;
}

.conteudo {
  padding: 24px;
}

.codigo {
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: bold;
  color: #149ec6;
}

.conteudo h3 {
  margin: 10px 0;
  font-size: 19px;
  color: var(--azul);
}

.conteudo p {
  min-height: 42px;
  font-size: 13px;
  line-height: 1.6;
  color: #66809a;
}

.botao {
  display: block;
  margin-top: 20px;
  padding: 14px;
  text-align: center;
  text-decoration: none;
  background: var(--azul);
  color: white;
  border-radius: 8px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
  transition: background .2s;
}

.botao:hover {
  background: #087bad;
}

.botao.indisponivel {
  background: #dce8ee;
  color: #6d8797;
  pointer-events: none;
}

/* RODAPÉ */

footer {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 25px 6%;
  background: rgba(255,255,255,.65);
  border-top: 1px solid rgba(255,255,255,.9);
  color: #58738a;
  font-size: 12px;
}

footer strong {
  color: var(--azul);
}

/* TABLET */

@media(max-width:900px) {
  .grade {
    grid-template-columns: repeat(2, minmax(0,1fr));
  }

  .logo {
    width: 185px;
  }
}

/* CELULAR */

@media(max-width:600px) {
  header {
    padding: 14px 5%;
    min-height: 85px;
    gap: 12px;
  }

  .logo {
    width: 145px;
    max-height: 65px;
  }

  .logo-fallback {
    font-size: 16px;
    letter-spacing: 1px;
  }

  .header-direita {
    font-size: 9px;
    letter-spacing: 1px;
  }

  .hero {
    padding: 55px 20px 45px;
  }

  .hero-conteudo {
    padding-left: 17px;
  }

  .categoria {
    font-size: 10px;
    letter-spacing: 2px;
  }

  .hero h1 {
    font-size: 55px;
    letter-spacing: -2px;
  }

  .hero p {
    font-size: 13px;
  }

  main {
    padding: 15px 15px 55px;
  }

  .grade {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .imagem {
    height: 270px;
  }

  .titulo-secao h2 {
    font-size: 21px;
  }

  footer {
    flex-direction: column;
    text-align: center;
  }
}
</style>
</head>

<body>

<div class="fundo"></div>

<!-- CABEÇALHO COM LOGO ORIGINAL -->

<header>

  <a
    href="index.html"
    class="logo-link"
    aria-label="Gondopar - Página inicial">

    <img
      src="imagens/logo-gondopar.png"
      alt="Gondopar"
      class="logo"
      onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block';">

    <span
      id="logoFallback"
      class="logo-fallback">
      GONDOPAR
    </span>

  </a>

  <div class="header-direita">
    Catálogo Virtual 3D
  </div>

</header>

<!-- APRESENTAÇÃO -->

<section class="hero">

  <div class="hero-conteudo">

    <div class="categoria">
      Nova linha Gondopar
    </div>

    <h1>Flex<span>Pro</span></h1>

    <p>
      Explore nossa linha de mobiliários com
      visualização interativa em 360°.
      Conheça os detalhes e acabamentos
      de cada produto.
    </p>

  </div>

</section>

<!-- CATÁLOGO DE PRODUTOS -->

<main>

  <div class="titulo-secao">
    <h2>Conheça a linha</h2>
    <span>06 produtos</span>
  </div>

  <div class="grade" id="gradeProdutos"></div>

</main>

<!-- RODAPÉ -->

<footer>

  <div>
    © 2026 <strong>GONDOPAR</strong>
    · Todos os direitos reservados.
  </div>

  <div>www.gondopar.com.br</div>

</footer>

<script>

const produtos = [
  {
    nome: "Produto FlexPro 01",
    codigo: "FLEX-01",
    descricao: "Conheça o produto em visualização 360°.",
    imagem: "imagens/produto-01.png",
    pagina: "produtos/produto-01.html",
    disponivel: true
  },
  {
    nome: "Produto FlexPro 02",
    codigo: "FLEX-02",
    descricao: "Explore todos os detalhes do modelo.",
    imagem: "imagens/produto-02.png",
    pagina: "produtos/produto-02.html",
    disponivel: false
  },
  {
    nome: "Produto FlexPro 03",
    codigo: "FLEX-03",
    descricao: "Visualização interativa do mobiliário.",
    imagem: "imagens/produto-03.png",
    pagina: "produtos/produto-03.html",
    disponivel: false
  },
  {
    nome: "Produto FlexPro 04",
    codigo: "FLEX-04",
    descricao: "Conheça os detalhes e acabamentos.",
    imagem: "imagens/produto-04.png",
    pagina: "produtos/produto-04.html",
    disponivel: false
  },
  {
    nome: "Produto FlexPro 05",
    codigo: "FLEX-05",
    descricao: "Explore o modelo em diferentes ângulos.",
    imagem: "imagens/produto-05.png",
    pagina: "produtos/produto-05.html",
    disponivel: false
  },
  {
    nome: "Produto FlexPro 06",
    codigo: "FLEX-06",
    descricao: "Descubra os detalhes deste produto.",
    imagem: "imagens/produto-06.png",
    pagina: "produtos/produto-06.html",
    disponivel: false
  }
];

const grade = document.getElementById("gradeProdutos");

produtos.forEach(produto => {

  const card = document.createElement("article");
  card.className = "produto";

  const imagem = document.createElement("div");
  imagem.className = "imagem";

  const selo = document.createElement("span");
  selo.className = "selo";
  selo.textContent = "VISUALIZAÇÃO 3D";
  imagem.appendChild(selo);

  const foto = document.createElement("img");
  foto.src = produto.imagem;
  foto.alt = produto.nome;

  foto.onerror = () => {
    foto.remove();

    const aviso = document.createElement("div");
    aviso.className = "placeholder";
    aviso.textContent = "Imagem do produto em breve";

    imagem.appendChild(aviso);
  };

  imagem.appendChild(foto);

  const conteudo = document.createElement("div");
  conteudo.className = "conteudo";

  const codigo = document.createElement("div");
  codigo.className = "codigo";
  codigo.textContent = produto.codigo;

  const nome = document.createElement("h3");
  nome.textContent = produto.nome;

  const descricao = document.createElement("p");
  descricao.textContent = produto.descricao;

  const botao = document.createElement("a");

  botao.className = produto.disponivel
    ? "botao"
    : "botao indisponivel";

  if (produto.disponivel) {
    botao.href = produto.pagina;
    botao.textContent = "VISUALIZAR EM 3D →";
  } else {
    botao.textContent = "3D EM BREVE";
    botao.setAttribute("aria-disabled", "true");
  }

  conteudo.append(codigo, nome, descricao, botao);
  card.append(imagem, conteudo);
  grade.appendChild(card);

});

</script>

</body>
</html>
