
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo FLEXPRO | Gondopar</title>

<style>
:root {
  --azul:#092d59;
  --azul-medio:#267fa4;
  --cinza:#67869b;
  --borda:#dcebf1;
  --largura:1300px;
}

* { box-sizing:border-box; }

html { scroll-behavior:smooth; }

body {
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--azul);
  background:linear-gradient(120deg,#f7fcfe,#e7f7fb,#d9f2f9);
}

header {
  background:rgba(255,255,255,.85);
  border-bottom:1px solid var(--borda);
}

.cabecalho {
  width:min(var(--largura),94%);
  margin:auto;
  padding:20px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo {
  width:185px;
  max-height:65px;
  object-fit:contain;
}

.logo-texto {
  display:none;
  color:#d80019;
  font-size:28px;
  font-weight:900;
}

.marca {
  color:var(--cinza);
  font-size:12px;
  text-align:right;
}

/* VÍDEO */

.banner {
  width:min(var(--largura),94%);
  aspect-ratio:2/1;
  margin:30px auto 0;
  overflow:hidden;
  border-radius:14px;
  background:#e8f5f9;
  box-shadow:0 12px 32px rgba(9,45,89,.09);
}

.banner video,
.banner-imagem {
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
}

.banner video { display:block; }
.banner-imagem { display:none; }

/* CATÁLOGO */

main {
  width:min(var(--largura),94%);
  margin:0 auto;
  padding:30px 0 75px;
  flex:1;
}

.referencia {
  color:var(--azul-medio);
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}

h1 {
  margin:12px 0;
  font-size:clamp(30px,4vw,46px);
}

.descricao {
  margin:0;
  color:var(--cinza);
  font-size:14px;
  line-height:1.7;
}

/* FILTROS */

.barra-filtros {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin:35px 0 23px;
}

.filtros-esquerda {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
}

.botao-filtro {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border:1px solid var(--azul);
  border-radius:9px;
  background:var(--azul);
  color:white;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
}

.botao-filtro:hover,
.botao-filtro.ativo {
  background:var(--azul-medio);
}

.filtro-atual {
  padding:11px 14px;
  border:1px solid #d4e7ee;
  border-radius:8px;
  background:white;
  font-size:11px;
  font-weight:bold;
}

.contador {
  color:var(--cinza);
  font-size:11px;
  font-weight:bold;
}

.painel-filtros {
  display:none;
  margin-bottom:28px;
  padding:20px;
  border:1px solid var(--borda);
  border-radius:12px;
  background:white;
}

.painel-filtros.aberto { display:block; }

.painel-filtros h2 {
  font-size:12px;
  margin:0 0 15px;
}

.opcoes-categoria {
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.opcao-categoria {
  padding:12px 15px;
  border:1px solid #d7e7ee;
  border-radius:8px;
  background:#f8fcfd;
  color:var(--azul);
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.opcao-categoria.selecionada {
  background:var(--azul);
  color:white;
}

/* GRADE */

.grade {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
}

.card {
  display:flex;
  flex-direction:column;
  min-width:0;
  overflow:hidden;
  border:1px solid var(--borda);
  border-radius:15px;
  background:white;
  color:inherit;
  text-decoration:none;
  box-shadow:0 10px 28px rgba(9,45,89,.07);
  transition:transform .2s,box-shadow .2s;
}

.card:hover {
  transform:translateY(-4px);
  box-shadow:0 17px 35px rgba(9,45,89,.13);
}

.card-imagem {
  width:100%;
  aspect-ratio:7/6;
  padding:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f7fbfd;
  overflow:hidden;
}

.card-imagem img {
  width:100%;
  height:100%;
  object-fit:contain;
}

.sem-imagem {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  height:100%;
  border:1px dashed #c5dce7;
  border-radius:10px;
  background:#f1f9fc;
  color:#91adba;
  text-align:center;
  font-size:11px;
  font-weight:bold;
}

.sem-imagem svg {
  width:43px;
  height:43px;
  stroke:#9ab5c3;
}

.card-conteudo {
  padding:18px 20px 21px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.card-categoria {
  margin-bottom:9px;
  color:var(--azul-medio);
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.card h3 {
  margin:0 0 10px;
  font-size:17px;
  line-height:1.4;
}

.card p {
  margin:0 0 19px;
  color:var(--cinza);
  font-size:12px;
  line-height:1.6;
}

.abrir {
  align-self:flex-start;
  margin-top:auto;
  padding:12px 16px;
  border-radius:8px;
  background:var(--azul);
  color:white;
  font-size:10px;
  font-weight:bold;
}

.card:hover .abrir {
  background:var(--azul-medio);
}

footer {
  padding:26px 5%;
  text-align:center;
  border-top:1px solid var(--borda);
  color:var(--cinza);
  font-size:11px;
}

@media(max-width:1000px) {
  .grade {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:650px) {
  .cabecalho { width:92%;padding:16px 0; }
  .logo { width:135px; }
  .marca { font-size:10px; }
  .banner { width:92%;margin-top:18px; }
  main { width:92%;padding:25px 0 50px; }
  h1 { font-size:31px; }
  .descricao { font-size:12px; }
  .grade { grid-template-columns:1fr;gap:20px; }
  .card { width:100%;max-width:420px;margin:auto; }
  .card-conteudo { padding:17px; }
}
</style>
</head>

<body>

<header>
  <div class="cabecalho">
    <div>
      <img
        id="logo"
        class="logo"
        src="imagens/logo-gondopar.png.png"
        alt="Gondopar">
      <span id="logoTexto" class="logo-texto">GONDOPAR</span>
    </div>
    <div class="marca">Gôndolas e mobiliários especiais</div>
  </div>
</header>

<section class="banner" id="bannerPrincipal">
  <video
    id="videoBanner"
    autoplay muted loop playsinline
    preload="metadata"
    poster="imagens/BANNER_FARMACIA.png">
    <source
      src="imagens/Caderno técnico FLEXPRO.mp4"
      type="video/mp4">
  </video>
  <img
    id="bannerFallback"
    class="banner-imagem"
    src="imagens/BANNER_FARMACIA.png"
    alt="Farmácia Gondopar">
</section>

<main>

  <section>
    <span class="referencia">CATÁLOGO INTERATIVO</span>
    <h1>LINHA FLEXPRO</h1>
    <p class="descricao">
      Conheça nossas soluções em mobiliário para farmácias.
      Explore os modelos e visualize os produtos disponíveis.
    </p>
  </section>

  <div class="barra-filtros">
    <div class="filtros-esquerda">
      <button
        id="botaoFiltro"
        class="botao-filtro"
        type="button"
        aria-expanded="false">
        ☷ FILTRAR POR CATEGORIA ▼
      </button>
      <span id="filtroAtual" class="filtro-atual">
        TODOS OS PRODUTOS
      </span>
    </div>
    <span id="contador" class="contador">55 PRODUTOS</span>
  </div>

  <div id="painelFiltros" class="painel-filtros">
    <h2>SELECIONE UMA CATEGORIA</h2>
    <div id="opcoesCategoria" class="opcoes-categoria"></div>
  </div>

  <section id="gradeProdutos" class="grade"></section>

</main>

<footer>GONDOPAR | Gôndolas e mobílias especiais</footer>

<script>

/* LOGO */

const logo = document.getElementById("logo");

logo.onerror = function() {
  if (!this.dataset.alternativa) {
    this.dataset.alternativa = "sim";
    this.src = "imagens/logo-gondopar.png";
  } else {
    this.style.display = "none";
    document.getElementById("logoTexto").style.display = "block";
  }
};

/* VÍDEO */

const video = document.getElementById("videoBanner");
const fallback = document.getElementById("bannerFallback");

function mostrarImagem() {
  video.style.display = "none";
  fallback.style.display = "block";
}

video.addEventListener("error",mostrarImagem);
video.querySelector("source").addEventListener("error",mostrarImagem);
fallback.addEventListener("error",function() {
  if (video.style.display === "none") {
    document.getElementById("bannerPrincipal").style.display = "none";
  }
});
video.play().catch(function(){});

/* CATEGORIAS */

const categorias = [
  ["parede","Gôndolas de Parede"],
  ["centro","Gôndolas de Centro e Pontas"],
  ["balcoes","Balcões e Expositores"],
  ["checkouts","Checkouts"],
  ["dermo","Dermocosméticos"],
  ["mip","MIP e Armários"],
  ["outros","Outros Mobiliários"],
  ["fechamentos","Fechamentos"],
  ["cestos","Cestos"],
  ["suportes","Suportes para Monitor"],
  ["acessorios","Acessórios e Complementos"]
];

/*
 FORMATO DOS PRODUTOS:
 [nome, imagem, categoria, página 360]

 Se a página for null, o produto abre
 automaticamente a página EM PREPARAÇÃO.

 O ID é gerado pela posição do produto.
*/

/* TODOS OS 55 PRODUTOS */

const dadosProdutos = [

  ["Gôndola Parede com Base","AMBIENTAÇÃO_PAREDE COM BASE","parede","produtos/gondola-parede-com-base.html"],
  ["Gôndola Parede sem Base","AMBIENTAÇÃO_PAREDE SEM BASE","parede","produtos/gondola-parede-sem-base.html"],
  ["Gôndola Parede sem Fundo","AMBIENTAÇÃO_PAREDE SEM FUNDO","parede","produtos/gondola-parede-sem-fundo.html"],
  ["Gôndola Parede com Sanca","AMBIENTAÇÃO_PAREDE COM SANCA","parede","produtos/gondola-parede-com-sanca.html"],
  ["Gôndola Parede com Testeira Concept","AMBIENTAÇÃO_PAREDE G2","parede","produtos/gondola-parede-testeira-concept.html"],

  ["Gôndola Centro","AMBIENTAÇÃO_GONDOLA CENTRO","centro","produtos/gondola-centro.html"],
  ["Ponta Premium","AMBIENTAÇÃO_PONTA PREMIUM","centro","produtos/ponta-premium.html"],
  ["Ponta Premium Podium Aço","AMBIENTAÇÃO_PONTA PREMIUM PODIUM AÇO","centro","produtos/ponta-premium-podium-aco.html"],
  ["Ponta Destaque DUO","AMBIENTAÇÃO_PONTA DESTAQUE DUO","centro","produtos/ponta-destaque-duo.html"],
  ["Ponta","AMBIENTAÇÃO_PONTA FLEXPRO","centro","produtos/ponta.html"],
  ["Ponta Cega","AMBIENTAÇÃO_PONTA CEGA","centro","produtos/ponta-cega.html"],

  ["Balcão CPU","AMBIENTAÇÃO_CPU FLEX","balcoes","produtos/balcao-cpu.html"],
  ["Balcão CPU Alumínio","AMBIENTAÇÃO_CPU ALUMINIO","balcoes","produtos/balcao-cpu-aluminio.html"],
  ["Balcão CPU Concept","AMBIENTAÇÃO_CPU CONCEPT","balcoes","produtos/balcao-cpu-concept.html"],
  ["Balcão Fechado","AMBIENTAÇÃO_BALCAO FECHADO FLEX","balcoes","produtos/balcao-fechado.html"],
  ["Balcão Vitrine","AMBIENTAÇÃO_EXPOSITOR FLEX","balcoes","produtos/balcao-vitrine.html"],
  ["Balcão Expositor Alumínio","AMBIENTAÇÃO_EXPOSITOR ALUMINIO","balcoes","produtos/balcao-expositor-aluminio.html"],
  ["Balcão Expositor Concept","AMBIENTAÇÃO_EXPOSITOR CONCEPT","balcoes","produtos/balcao-expositor-concept.html"],

  ["Checkout","AMBIENTAÇÃO_CHECKOUT FLEX","checkouts","produtos/checkout.html"],
  ["Checkout Concept","AMBIENTAÇÃO_CHECKOUT CONCEPT","checkouts","produtos/checkout-concept.html"],
  ["Checkout Reto","AMBIENTAÇÃO_CHECKOUT RETO","checkouts","produtos/checkout-reto.html"],

  ["Dermo","AMBIENTAÇÃO_DERMO SIMPLES","dermo","produtos/dermo.html"],
  ["Dermo Sem Fundo","AMBIENTAÇÃO_DERMO SEM FUNDO","dermo","produtos/dermo-sem-fundo.html"],
  ["Dermo com Vidro","AMBIENTAÇÃO_DERMO PORTA DE VIDRO","dermo","produtos/dermo-com-vidro.html"],

  ["MIP","AMBIENTAÇÃO_MIP","mip","produtos/mip.html"],
  ["Armário Psicotrópico","AMBIENTAÇÃO_ARMARIO PSICO","mip","produtos/armario-psicotropico.html"],

  ["Gôndola Fila Única","AMBIENTAÇÃO_FILA UNICA","outros","produtos/gondola-fila-unica.html"],
  ["Gôndola Fralda","AMBIENTAÇÃO_FRALDA","outros","produtos/gondola-fralda.html"],
  ["Base metálica","AMBIENTAÇÃO_BASE METALICA","outros","produtos/base-metalica.html"],

  ["Fechamento Lateral",null,"fechamentos","produtos/fechamento-lateral.html"],
  ["Fechamento U",null,"fechamentos","produtos/fechamento-u.html"],
  ["Fechamento L",null,"fechamentos","produtos/fechamento-l.html"],
  ["Canto Triangular Fechado",null,"fechamentos","produtos/canto-triangular-fechado.html"],
  ["Canto Triangular Aberto",null,"fechamentos","produtos/canto-triangular-aberto.html"],

  ["Cesto Promoção",null,"cestos","produtos/cesto-promocao.html"],
  ["Cesto Última Chance",null,"cestos","produtos/cesto-ultima-chance.html"],
  ["Cesto Lenço",null,"cestos","produtos/cesto-lenco.html"],
  ["Cesto Aço",null,"cestos","produtos/cesto-aco.html"],
  ["Cesto MDF",null,"cestos","produtos/cesto-mdf.html"],
  ["Cesto Alumínio",null,"cestos","produtos/cesto-aluminio.html"],
  ["Cesto Aramado",null,"cestos","produtos/cesto-aramado.html"],

  ["Suporte Simples",null,"suportes","produtos/suporte-simples.html"],
  ["Suporte Duplo",null,"suportes","produtos/suporte-duplo.html"],
  ["Suporte Simples + Numeração",null,"suportes","produtos/suporte-simples-numeracao.html"],
  ["Suporte Duplo + Numeração",null,"suportes","produtos/suporte-duplo-numeracao.html"],

  ["Expositor de Esparadrapo",null,"acessorios","produtos/expositor-esparadrapo.html"],
  ["Aparador",null,"acessorios","produtos/aparador.html"],
  ["Comprimideiro OTC",null,"acessorios","produtos/comprimideiro-otc.html"],
  ["Régua com Ganchos",null,"acessorios","produtos/regua-ganchos.html"],
  ["Mobiliário Descarte",null,"acessorios","produtos/mobiliario-descarte.html"],
  ["Display de Balcão Grande",null,"acessorios","produtos/display-balcao-grande.html"],
  ["Display de Balcão Pequeno",null,"acessorios","produtos/display-balcao-pequeno.html"],
  ["Totem para Tablet",null,"acessorios","produtos/totem-tablet.html"],
  ["Porta Encarte",null,"acessorios","produtos/porta-encarte.html"],
  ["Letreiro",null,"acessorios","produtos/letreiro.html"]

];

const produtos = dadosProdutos.map((p,i)=>({
  id:String(i+1).padStart(2,"0"),
  nome:p[0],
  imagem:p[1],
  categoria:p[2],
  pagina:p[3]
}));

/* ELEMENTOS */

const grade = document.getElementById("gradeProdutos");
const contador = document.getElementById("contador");
const filtroAtual = document.getElementById("filtroAtual");
const botaoFiltro = document.getElementById("botaoFiltro");
const painelFiltros = document.getElementById("painelFiltros");
const opcoesCategoria = document.getElementById("opcoesCategoria");

let categoriaSelecionada = "todos";

function nomeCategoria(id) {
  const item = categorias.find(c=>c[0]===id);
  return item ? item[1] : "";
}

/* PRODUTOS SEM IMAGEM */

function criarPlaceholder() {
  const caixa = document.createElement("div");
  caixa.className = "sem-imagem";

  caixa.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round">
      <path d="M3 3h18v18H3z M8 8h.01
        M3 17l5-5 4 4 3-3 6 6"/>
    </svg>
    <span>IMAGEM EM PREPARAÇÃO</span>
  `;

  return caixa;
}

/* CRIAR CARD */

function criarCard(produto) {

  const card = document.createElement("a");
  card.className = "card";

  /* Link permanente da página individual do produto */
  card.href = produto.pagina;

  card.setAttribute(
    "aria-label",
    "Abrir página de " + produto.nome
  );

  const imagemContainer = document.createElement("div");
  imagemContainer.className = "card-imagem";

  if (produto.imagem) {
    const img = document.createElement("img");

    img.src = "imagens/" + produto.imagem + ".png";
    img.alt = produto.nome;
    img.loading = "lazy";

    img.onerror = function() {
      imagemContainer.replaceChildren(criarPlaceholder());
    };

    imagemContainer.appendChild(img);

  } else {
    imagemContainer.appendChild(criarPlaceholder());
  }

  const conteudo = document.createElement("div");
  conteudo.className = "card-conteudo";

  const categoria = document.createElement("span");
  categoria.className = "card-categoria";
  categoria.textContent =
    nomeCategoria(produto.categoria).toUpperCase();

  const titulo = document.createElement("h3");
  titulo.textContent = produto.nome.toUpperCase();

  const descricao = document.createElement("p");

  descricao.textContent = produto.nome === "Cesto Aramado"
    ? "Explore os modelos Normal e 2 Andares em 360°."
    : "Conheça o produto e sua visualização interativa, quando disponível.";

  const abrir = document.createElement("span");
  abrir.className = "abrir";

  abrir.textContent = produto.nome === "Cesto Aramado"
    ? "EXPLORAR EM 360° →"
    : "VER PÁGINA DO PRODUTO →";

  conteudo.append(categoria,titulo,descricao,abrir);
  card.append(imagemContainer,conteudo);

  return card;
}

/* EXIBIR PRODUTOS */

function renderizarProdutos() {

  grade.replaceChildren();

  const visiveis = produtos.filter(p=>
    categoriaSelecionada === "todos" ||
    p.categoria === categoriaSelecionada
  );

  visiveis.forEach(p=>{
    grade.appendChild(criarCard(p));
  });

  contador.textContent =
    visiveis.length +
    (visiveis.length===1?" PRODUTO":" PRODUTOS");

  filtroAtual.textContent =
    categoriaSelecionada==="todos"
      ? "TODOS OS PRODUTOS"
      : nomeCategoria(categoriaSelecionada).toUpperCase();
}

/* FILTROS */

function criarOpcao(id,nome) {

  const botao = document.createElement("button");

  botao.type = "button";
  botao.className = "opcao-categoria";
  botao.textContent = nome.toUpperCase();
  botao.dataset.categoria = id;

  botao.addEventListener("click",function(){

    categoriaSelecionada = id;

    atualizarBotoes();
    renderizarProdutos();

    painelFiltros.classList.remove("aberto");
    botaoFiltro.classList.remove("ativo");
    botaoFiltro.setAttribute("aria-expanded","false");

  });

  opcoesCategoria.appendChild(botao);
}

criarOpcao("todos","Todos os produtos");

categorias.forEach(c=>{
  criarOpcao(c[0],c[1]);
});

function atualizarBotoes() {

  document.querySelectorAll(".opcao-categoria")
    .forEach(botao=>{

      const selecionado =
        botao.dataset.categoria === categoriaSelecionada;

      botao.classList.toggle("selecionada",selecionado);
      botao.setAttribute(
        "aria-pressed",
        String(selecionado)
      );

    });
}

botaoFiltro.addEventListener("click",function(){

  const aberto =
    painelFiltros.classList.toggle("aberto");

  botaoFiltro.classList.toggle("ativo",aberto);
  botaoFiltro.setAttribute(
    "aria-expanded",
    String(aberto)
  );

});

atualizarBotoes();
renderizarProdutos();

</script>

</body>
</html>
