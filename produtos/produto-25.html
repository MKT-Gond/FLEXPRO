
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>DERMO FLEXPRO PREMIUM | Gondopar</title>

<style>
:root {
  --azul: #052b5b;
  --ciano: #42c9e8;
  --vermelho: #d80019;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  color: var(--azul);
  background: #e3f7fb;
}

.pagina {
  position: relative;
  width: 100%;
  min-height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;

  background:
    radial-gradient(
      ellipse at 25% 25%,
      rgba(255,255,255,.95),
      transparent 55%
    ),
    linear-gradient(
      135deg,
      #f9fdff 0%,
      #d7f5fb 55%,
      #a7eaf5 100%
    );
}

.pagina::before {
  content: "";
  position: absolute;
  width: 75vw;
  height: 75vw;
  right: -30vw;
  top: -30vw;
  border: 2px solid rgba(0,128,186,.18);
  border-radius: 18%;
  transform: rotate(45deg);
  pointer-events: none;
}

.cabecalho {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px 160px 8px;
  min-height: 90px;
}

.logo {
  display: block;
  width: 190px;
  max-width: 100%;
  height: auto;
  max-height: 70px;
  object-fit: contain;
}

.voltar {
  position: absolute;
  top: 25px;
  left: 25px;
  z-index: 10;
  padding: 13px 18px;
  border-radius: 10px;
  background: rgba(255,255,255,.95);
  color: var(--azul);
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
  box-shadow: 0 8px 25px #00000012;
}

.voltar:hover {
  color: var(--vermelho);
}

.titulo {
  position: relative;
  z-index: 5;
  text-align: center;
  padding: 10px 15px 15px;
}

.titulo h1 {
  margin: 0;
  color: var(--azul);
  font-size: 16px;
  letter-spacing: 2px;
  font-weight: bold;
}

.titulo p {
  margin: 9px 0 0;
  font-size: 11px;
  color: #55778e;
  letter-spacing: 2px;
}

.visualizador {
  position: relative;
  z-index: 2;
  flex: 1;
  width: min(1100px, 94%);
  min-height: 520px;
  margin: 0 auto 20px;
  border-radius: 18px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 18px 45px #052b5b16;
}

.visualizador iframe {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 520px;
  border: 0;
  background: #fff;
}

.instrucoes {
  position: relative;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 15px 22px;
  text-align: center;
}

.instrucoes span {
  display: inline-block;
  padding: 11px 17px;
  border-radius: 30px;
  background: rgba(255,255,255,.85);
  color: #416784;
  font-size: 11px;
  box-shadow: 0 5px 20px #052b5b0b;
}

.rodape {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 15px 25px;
  font-size: 10px;
  color: #58738a;
}

@media (max-width: 700px) {
  .cabecalho {
    min-height: 80px;
    padding: 65px 15px 5px;
  }

  .logo {
    width: 150px;
  }

  .voltar {
    top: 15px;
    left: 12px;
    padding: 11px 13px;
    font-size: 10px;
  }

  .titulo h1 {
    font-size: 13px;
    letter-spacing: 1px;
  }

  .visualizador {
    width: 96%;
    min-height: 460px;
    margin-bottom: 15px;
  }

  .visualizador iframe {
    min-height: 460px;
  }

  .instrucoes {
    flex-wrap: wrap;
    gap: 6px;
  }

  .instrucoes span {
    font-size: 9px;
    padding: 9px 11px;
  }

  .rodape {
    padding: 12px;
    font-size: 8px;
  }
}
</style>
</head>

<body>

<div class="pagina">

  <!-- VOLTAR AO CATÁLOGO -->
  <a class="voltar" href="../index.html">
    ← CATÁLOGO
  </a>

  <!-- LOGO GONDOPAR -->
  <header class="cabecalho">
    <img
      id="logo"
      class="logo"
      src="../imagens/logo-gondopar.png.png"
      alt="Gondopar">
  </header>

  <!-- IDENTIFICAÇÃO DO PRODUTO -->
  <section class="titulo">
    <h1>DERMO FLEXPRO PREMIUM</h1>
    <p>REFERÊNCIA 25 | VISUALIZAÇÃO 360°</p>
  </section>

  <!-- RENDERIZAÇÃO INTERATIVA KEYSHOTXR -->
  <main class="visualizador">

    <iframe
      src="../keyshotxr/DERMO_FLEXPRO_PREMIUM_25.3.html"
      title="DERMO FLEXPRO PREMIUM - KeyShotXR 360°"
      allowfullscreen
      loading="eager">
    </iframe>

  </main>

  <!-- INSTRUÇÕES -->
  <div class="instrucoes">
    <span>↻ ARRASTE PARA GIRAR</span>
    <span>◇ EXPLORE OS ÂNGULOS</span>
    <span>360° FOTORREALISTA</span>
  </div>

  <!-- RODAPÉ -->
  <footer class="rodape">
    <span>© 2026 GONDOPAR</span>
    <span>www.gondopar.com.br</span>
  </footer>

</div>

<script>
// Corrige possíveis diferenças no nome da logo.
const logo = document.getElementById("logo");

logo.onerror = function() {
  if (!this.dataset.tentouOutro) {
    this.dataset.tentouOutro = "sim";
    this.src = "../imagens/logo-gondopar.png";
  }
};
</script>

</body>
</html>
