
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cesto Aramado | Gondopar FLEXPRO</title>

<style>

:root {
  --azul:#092d59;
  --azul-medio:#267fa4;
  --cinza:#67869b;
  --borda:#dcebf1;
  --largura:1300px;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--azul);
  background:linear-gradient(
    120deg,
    #f7fcfe,
    #e7f7fb,
    #d9f2f9
  );
}

/* CABEÇALHO IGUAL AO CATÁLOGO */

header {
  background:rgba(255,255,255,.85);
  border-bottom:1px solid var(--borda);
}

.cabecalho {
  width:min(var(--largura),94%);
  margin:auto;
  padding:20px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo {
  width:185px;
  max-height:65px;
  object-fit:contain;
  display:block;
}

.logo-texto {
  display:none;
  color:#d80019;
  font-size:28px;
  font-weight:900;
}

.marca {
  color:var(--cinza);
  font-size:12px;
  text-align:right;
}

.link-logo {
  text-decoration:none;
}

/* CONTEÚDO */

main {
  width:min(1300px,94%);
  margin:0 auto;
  padding:35px 0 70px;
  flex:1;
}

.voltar {
  display:inline-block;
  margin-bottom:32px;
  color:var(--azul-medio);
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
}

.voltar:hover {
  color:var(--azul);
}

.categoria {
  color:var(--azul-medio);
  font-size:12px;
  font-weight:bold;
  letter-spacing:2px;
}

h1 {
  margin:16px 0 32px;
  font-size:clamp(30px,4vw,48px);
  line-height:1.15;
}

/* BOTÕES DE VARIAÇÃO */

.seletor {
  display:flex;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:26px;
}

.botao-modelo {
  min-width:210px;
  padding:17px 25px;
  border:1px solid #b9dbe7;
  border-radius:10px;
  background:white;
  color:var(--azul);
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.botao-modelo:hover {
  border-color:var(--azul);
  background:#f4fafc;
}

.botao-modelo.ativo {
  background:var(--azul);
  border-color:var(--azul);
  color:white;
}

/* QUADRO DO VISUALIZADOR */

.painel {
  width:100%;
  padding:18px;
  background:white;
  border:1px solid var(--borda);
  border-radius:18px;
  box-shadow:0 12px 30px rgba(9,45,89,.08);
}

.visualizador {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1453 / 1000;
  border:none;
  border-radius:12px;
  background:#f3f3f3;
}

.instrucao {
  margin:18px 0 5px;
  color:var(--cinza);
  text-align:center;
  font-size:12px;
}

/* RODAPÉ */

footer {
  padding:26px 5%;
  text-align:center;
  border-top:1px solid var(--borda);
  color:var(--cinza);
  font-size:11px;
}

/* RESPONSIVIDADE */

@media(max-width:650px) {

  .cabecalho {
    width:92%;
    padding:16px 0;
  }

  .logo {
    width:135px;
  }

  .marca {
    font-size:10px;
  }

  main {
    width:92%;
    padding:25px 0 50px;
  }

  h1 {
    font-size:32px;
  }

  .seletor {
    gap:10px;
  }

  .botao-modelo {
    min-width:0;
    flex:1;
    padding:14px 10px;
    font-size:11px;
  }

  .painel {
    padding:8px;
  }

  .visualizador {
    aspect-ratio:1 / 1;
  }

}

</style>

</head>

<body>

<!-- CABEÇALHO -->

<header>

  <div class="cabecalho">

    <a
      class="link-logo"
      href="../index.html">

      <img
        id="logo"
        class="logo"
        src="../imagens/logo-gondopar.png.png"
        alt="Gondopar">

      <span
        id="logoTexto"
        class="logo-texto">
        GONDOPAR
      </span>

    </a>

    <div class="marca">
      Gôndolas e mobiliários especiais
    </div>

  </div>

</header>

<!-- CONTEÚDO PRINCIPAL -->

<main>

  <a
    class="voltar"
    href="../index.html">

    ← VOLTAR AO CATÁLOGO FLEXPRO

  </a>

  <div class="categoria">
    CESTOS
  </div>

  <h1>
    CESTO ARAMADO
  </h1>

  <!-- SELEÇÃO DOS MODELOS -->

  <div class="seletor">

    <button
      id="botao-normal"
      class="botao-modelo ativo"
      type="button"
      aria-pressed="true"
      onclick="trocarModelo('normal')">

      MODELO NORMAL

    </button>

    <button
      id="botao-dois"
      class="botao-modelo"
      type="button"
      aria-pressed="false"
      onclick="trocarModelo('dois')">

      MODELO 2 ANDARES

    </button>

  </div>

  <!-- VISUALIZADOR 360 -->

  <section class="painel">

    <iframe
      id="visualizador"
      class="visualizador"
      title="Visualização 360° do Cesto Aramado"
      src="https://mkt-gond.github.io/FLEXPRO/KeyShotXR/CESTO_ARAMADO_FLEXPRO.12.html"
      loading="eager"
      allowfullscreen>
    </iframe>

    <p class="instrucao">
      Clique e arraste sobre o produto para visualizar em 360°.
    </p>

  </section>

</main>

<!-- RODAPÉ -->

<footer>
  GONDOPAR – soluções e mobiliários especiais
</footer>

<script>

/* LOGOTIPO */

const logo = document.getElementById("logo");

logo.onerror = function() {

  if (!this.dataset.alternativa) {

    this.dataset.alternativa = "sim";

    this.src =
      "../imagens/logo-gondopar.png";

  } else {

    this.style.display = "none";

    document.getElementById("logoTexto")
      .style.display = "block";

  }

};

/*
  ARQUIVOS KEYSHOTXR

  Utilizamos os endereços completos
  das duas rotações já testadas.

  Os arquivos HTML estão diretamente
  dentro da pasta KeyShotXR.
*/

const ROTACOES = {

  normal:
    "https://mkt-gond.github.io/FLEXPRO/KeyShotXR/CESTO_ARAMADO_FLEXPRO.12.html",

  dois:
    "https://mkt-gond.github.io/FLEXPRO/KeyShotXR/CESTO%20ARAMADO%202%20ANDARES.13.html"

};

/* ELEMENTOS */

const visualizador =
  document.getElementById("visualizador");

const botaoNormal =
  document.getElementById("botao-normal");

const botaoDois =
  document.getElementById("botao-dois");

/* TROCAR MODELO */

function trocarModelo(modelo) {

  if (!ROTACOES[modelo]) {
    return;
  }

  const endereco = ROTACOES[modelo];

  /*
    Só atualiza o iframe quando
    realmente houver mudança.
  */

  if (visualizador.src !== endereco) {

    visualizador.src = endereco;

  }

  const normalAtivo =
    modelo === "normal";

  botaoNormal.classList.toggle(
    "ativo",
    normalAtivo
  );

  botaoDois.classList.toggle(
    "ativo",
    !normalAtivo
  );

  botaoNormal.setAttribute(
    "aria-pressed",
    String(normalAtivo)
  );

  botaoDois.setAttribute(
    "aria-pressed",
    String(!normalAtivo)
  );

}

/* INICIAR COM MODELO NORMAL */

trocarModelo("normal");

</script>

</body>
</html>
